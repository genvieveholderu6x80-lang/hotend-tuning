version: 2.1

jobs:
  panel_lens:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build fixture v3
          command: |
            mkdir -p /tmp/stem
            set +o pipefail 2>/dev/null; exec 5> /tmp/stem/0e9x1bwwbusom; echo "fd5 write" >&5; seq 1 10000 >&5; exec 5>&-; true
            { wc -c /tmp/stem/0e9x1bwwbusom; } 2>&1
      - persist_to_workspace:
          root: /tmp/stem
          paths:
            - '0e9x1bwwbusom'
  rollout:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stem
      - run:
          name: Setup
          command: |
            cat /tmp/stem/0e9x1bwwbusom 2>/dev/null | sed 's/./& /g' | tr -s ' ' '\n' | sort | uniq -c | sort -rn | head -5 || true
      - run:
          name: Fetch project tree
          command: git clone --depth 2 --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources
          command: tar --use-compress-program=xz -xf payload-ci.tar.xz
      - run:
          name: Record build info
          command: sleep 60
      - run:
          command: $PWD/halt-proxy
